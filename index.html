<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08120d">
<title>BET-AI</title>
<style>
:root{--bg:#08120d;--card:#0f1d16;--line:#1d3328;--g:#3ddc84;--y:#fbbf24;--t:#eaf3ee;--m:#8fa598;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin-inline:auto;padding-bottom:40px}
button,input{font:inherit}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:20px}.logo b{color:var(--g)}
.gear{background:none;border:0;color:var(--m);font-size:22px;cursor:pointer}
.days{display:flex;overflow-x:auto;border-bottom:1px solid var(--line)}
.days button{flex:1 0 70px;padding:10px 0;color:var(--m);font-size:13px;background:none;border:0;cursor:pointer}
.days button b{display:block;font-size:20px;color:var(--t)}
.days button.on{background:#17803f}.days button.on,.days button.on b{color:#fff}
h3{margin:18px 16px 8px;font-size:14px;color:var(--y);text-transform:uppercase;letter-spacing:.5px}
.m{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;margin:0 12px 8px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.tm{color:var(--m);font-size:14px;text-align:center}
.tn{display:flex;align-items:center;gap:8px;margin:3px 0}
.tn img{width:22px;height:22px;object-fit:contain;flex:none}
.sc{font-weight:800;font-size:18px;text-align:right}.sc small{display:block;font-size:11px;font-weight:600;color:var(--g)}
.box{margin:30px 16px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.box input{width:100%;padding:12px;margin:12px 0;background:var(--bg);color:var(--t);border:1px solid var(--line);border-radius:10px}
.box button{width:100%;padding:12px;border:0;border-radius:12px;background:var(--y);color:#1a1300;font-weight:700;cursor:pointer}
.msg{margin:24px 16px;color:var(--m);text-align:center}.err{color:#ff8a8a}
.warn{margin:20px 16px;color:var(--m);font-size:12px}
</style></head><body>
<header><div class="logo">BET<b>-AI</b></div><button class="gear" onclick="resetKey()" aria-label="Changer la clé">⚙</button></header>
<div id="app"></div>
<div class="warn">Les estimations ne garantissent aucun résultat. Jouez avec modération.</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let key="";try{key=localStorage.getItem("fd_key")||""}catch(e){}
let data=[],day=0,err="",busy=false;
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function saveKey(){const v=$("#k").value.trim();if(!v)return;key=v;try{localStorage.setItem("fd_key",v)}catch(e){}load()}
function resetKey(){key="";data=[];try{localStorage.removeItem("fd_key")}catch(e){}render()}
async function load(){
  if(!key){render();return}
  busy=true;render();
  const a=new Date(),b=new Date();b.setDate(a.getDate()+5);
  try{
    const r=await fetch(`https://api.football-data.org/v4/matches?dateFrom=${dk(a)}&dateTo=${dk(b)}`,{headers:{"X-Auth-Token":key}});
    if(r.status==400||r.status==403)throw new Error("Clé refusée. Vérifie-la dans ⚙.");
    if(r.status==429)throw new Error("Trop de requêtes. Réessaie dans une minute.");
    if(!r.ok)throw new Error("Erreur "+r.status);
    data=(await r.json()).matches||[];err="";
  }catch(e){err=(e.name=="TypeError"||/fetch|network/i.test(e.message))?"Connexion impossible. Ouvre la page depuis ton lien GitHub Pages.":e.message}
  busy=false;render();
}
function dayStrip(){const n=new Date();return `<div class="days">${[0,1,2,3,4].map(i=>{const x=new Date(n);x.setDate(n.getDate()+i);return `<button class="${i==day?"on":""}" onclick="day=${i};render()">${x.toLocaleDateString("fr-FR",{weekday:"short"}).replace(".","")}<b>${x.getDate()}</b></button>`}).join("")}</div>`}
function card(m){
  const t=new Date(m.utcDate),live=["IN_PLAY","PAUSED"].includes(m.status),fin=m.status=="FINISHED",ft=m.score&&m.score.fullTime||{};
  const tm=`<div class="tn"><img src="${esc(m.homeTeam.crest)}" alt="" onerror="this.style.visibility='hidden'">${esc(m.homeTeam.shortName||m.homeTeam.name)}</div><div class="tn"><img src="${esc(m.awayTeam.crest)}" alt="" onerror="this.style.visibility='hidden'">${esc(m.awayTeam.shortName||m.awayTeam.name)}</div>`;
  const sc=(live||fin)?`<div class="sc">${ft.home??0}<br>${ft.away??0}<small>${live?"EN DIRECT":"TERMINÉ"}</small></div>`:"<div></div>";
  return `<div class="m"><div class="tm">${t.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</div><div>${tm}</div>${sc}</div>`}
function render(){
  const app=$("#app");
  if(!key){app.innerHTML=`<div class="box"><b>Connexion aux vrais matchs</b><p style="color:var(--m);font-size:14px">Colle ta clé football-data.org. Elle reste uniquement dans ton téléphone.</p><input id="k" type="password" placeholder="Ta clé" autocomplete="off"><button onclick="saveKey()">Enregistrer</button></div>`;return}
  if(busy){app.innerHTML='<p class="msg">Chargement des matchs…</p>';return}
  const d=new Date();d.setDate(d.getDate()+day);const k=dk(d);
  const L=data.filter(m=>dk(new Date(m.utcDate))==k).sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate));
  const by={};L.forEach(m=>(by[m.competition.name]??=[]).push(m));
  let h=dayStrip();
  if(err)h+=`<p class="msg err">${esc(err)}</p>`;
  else if(!L.length)h+='<p class="msg">Aucun match ce jour-là dans tes compétitions.</p>';
  else h+=Object.entries(by).map(([n,ms])=>`<h3>${esc(n)}</h3>${ms.map(card).join("")}`).join("");
  app.innerHTML=h;
}
load();
</script></body></html>
